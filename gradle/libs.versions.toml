# Versions reprises de Surculus (gradle/libs.versions.toml, commit b9cf9d6, 2026-10-28), qui les source une à une.
# Une montée de version se fait d'abord dans Surculus ou Marculus, puis ici.
# Mission 005 (journal et sauvegarde) : plugin android-library, KSP, Room, room-testing, Robolectric,
# androidx.test:core et JUnit 4, repris de Surculus gradle/libs.versions.toml au commit 3c01f4b (l. 7-9, 10, 17,
# 22, 24, 40-42, 46, 49, 64-66, 80-83), qui en donne les sources.

[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.02.01"
activityCompose = "1.8.2"
lifecycle = "2.9.4"
coreKtx = "1.16.0"
coroutines = "1.10.2"
junitJupiter = "6.1.3"
gson = "2.14.0"
ksp = "2.3.12"
room = "2.8.1"
robolectric = "4.17"
androidxTestCore = "1.7.0"
junit4 = "4.13.2"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
