name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Lecture seule : la CI ne pousse jamais sur main.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurer JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurer le SDK Android
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Commande de tests du projet (.claude/test-command)
        run: sh -c "$(cat .claude/test-command) --no-daemon"

      # Mission 004 : les tests d'acceptation de l'échange (003) ne doivent jamais rester sautés sans bruit (condition du
      # relecteur de 003). Avec RAMULUS_ECHANGE_EXIGER=1, un module absent ou renommé fait échouer ces tests au lieu de les désactiver.
      - name: Tests d'acceptation de l'échange, exigés (RAMULUS_ECHANGE_EXIGER=1)
        env:
          RAMULUS_ECHANGE_EXIGER: '1'
        run: ./gradlew :core:test --no-daemon

      - name: Publier l'APK de debug
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Format d'échange deperis-v1 (mission 002) : les GeoPackages d'exemple sont écrits avec le module sqlite3 de Python
  # selon OGC 12-128, et validés ici par GDAL (M1, option b, Pascal le 2026-10-28).
  format-echange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer GDAL (ogrinfo) et jsonschema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin
          ogrinfo --version
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install jsonschema==4.26.0

      - name: Tests du format (schéma, cas communs, contrôle de référence, fusion)
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s fixtures/echange/tests -v'

      - name: Chaque GeoPackage d'exemple passe ogrinfo
        run: '"$RUNNER_TEMP/venv/bin/python" fixtures/echange/verifier_ogrinfo.py'
