# Précision du GNSS d'un téléphone sous couvert forestier — référentiel Ramulus
# Propriétaire : Pascal. Acquis par : acquereur (mission 001, cycle 2). Consulté le 2026-10-28.
# Décision éclairée : le seuil d'écart entre le centre relevé et le point prévu (valeur provisoire de 30 m,
# ADR 0004, mission 007). Ce fichier ne fixe pas le seuil ; il donne ce que les sources mesurent.
#
# CQQCOQP de la donnée principale (Purfürst 2022) :
#   Pourquoi : savoir si le GNSS d'un téléphone suffit à placer le centre d'une placette (alarme sur erreur grossière).
#   Qui : T. Purfürst, chaire d'exploitation forestière, université de Fribourg-en-Brisgau (recherche publique).
#   Quoi : déviation bidimensionnelle absolue de la position (tableau 4), par modèle de téléphone.
#   Comment : positionnement autonome statique, « not externally corrected in any way » ; 24 mesures d'environ
#     10 min à 1 Hz ; les erreurs sont calculées à chaque seconde (chaque fix), PAS sur une position moyennée.
#   Où : 15 sites sous couvert, points géodésiques officiels de position connue ; essences, relief, fermeture du
#     couvert et état du feuillage variables (Europe centrale, pays non relu dans cette mission).
#   Quand : feuillage variable (« foliage conditions varied »).
#   Combien : 10 téléphones + 1 récepteur géodésique de référence (Geo 7X), n = 131 338 positions au total.
#
# Sources :
#  P. Purfürst T., « Evaluation of Static Autonomous GNSS Positioning Accuracy Using Single-, Dual-, and Tri-Frequency
#     Smartphones in Forest Canopy Environments », Sensors 22(3):1289, 8 février 2022, DOI 10.3390/s22031289.
#     Lu le 2026-10-28 par le texte intégral XML d'Europe PMC :
#     https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8838512/fullTextXML (tableau 4 et section 3.2).
#     Les pages https://pmc.ncbi.nlm.nih.gov/articles/PMC8838512/ (verification reCAPTCHA) et
#     https://www.mdpi.com/1424-8220/22/3/1289 (HTTP 403) n'ont pas pu être lues ; la page PMC de l'ADR 0003
#     reste donc la référence citée, le contenu vient d'Europe PMC (même texte, voie différente).
#  M. Murgaš V., Sačkov I., Sedliak M., Tunák D., Chudý F., « Assessing horizontal accuracy of inventory plots in
#     forests with different mix of tree species composition and development stage », Journal of Forest Science
#     64(11):478-485, 2018, DOI 10.17221/92/2018-JFS ; résumé (p. 478) et introduction (p. 479) lus le 2026-10-28 :
#     https://jfs.agriculturejournals.cz/pdfs/jfs/2018/11/03.pdf
#  S. Surculus, ADR 0003 « GNSS et repères » (dépôt local /home/pascal/dev/surculus/docs/adr/0003-gnss-et-reperes.md,
#     lu le 2026-10-28), qui cite Purfürst 2022 tableau 4 : « 6,1 m d'erreur horizontale moyenne, CEP95 13,4 m,
#     jusqu'à 42 m pour un modèle ». Ramulus l'a repris dans l'ADR 0004.
#
# Deuxième source qui se trompe pour une autre raison : Murgaš 2018 (récepteur de cartographie, placettes
# d'inventaire, 2017 feuillage, vérité terrain relevée en 2018 sans feuillage) contre Purfürst (téléphones, points
# géodésiques, mesures statiques de 10 min).
#
# Comparaison et écarts :
#   Concordance d'ordre de grandeur : Purfürst, erreur moyenne des téléphones 6,50 m (calcul ci-dessous) ;
#   Murgaš, RMSE 8,45 m sous couvert (45 placettes), 6,61 m à découvert (5 placettes).
#   E1. Les chiffres de l'ADR 0003 sont ceux de la ligne « All » du tableau 4, qui INCLUT le récepteur
#       géodésique de référence Geo 7X (n = 12 096 sur 131 338). Pour les seuls téléphones (n = 119 242), la
#       moyenne pondérée des deux lignes « MultiF » est 6,50 m (calcul : (7,07 × 72 698 + 5,62 × 46 544) / 119 242),
#       non 6,14 m. Le CEP95 de la ligne « All » (13,38 m) est celui de la ligne « MultiF Yes » ; pour les téléphones
#       monofréquence il est de 13,64 m. L'ADR cite donc 6,1 m et 13,4 m (arrondis de 6,14 et 13,38) comme
#       s'ils valaient pour des téléphones ; l'ordre de grandeur est juste, la valeur 6,1 m est trop basse de
#       0,4 m pour les téléphones seuls.
#   E2. « Jusqu'à 42 m pour un modèle » : confirmé comme CEP95 du Xcover 4 (41,99 m), un téléphone monofréquence ;
#       la même valeur 41,99 figure en CEP99,7 des lignes « MultiF No » et « All » (donnée recoupée).
#   E3. Purfürst mesure des fixes isolés (1 Hz, 10 min) ; la spec et l'ADR 0004 moyennent la position. Purfürst ne
#       teste pas l'effet du moyennage : ce qu'il apporte sous couvert n'est pas sourcé ici.
#   E4. Murgaš : récepteur de cartographie, non téléphone ; sa vérité terrain est un récepteur topographique ;
#       il note « no statistically significant effect of tree species composition and stand age » (résumé),
#       mais « decreased positional errors in coniferous forests as well as in younger forests ».
#   E5. L'écart entre le point prévu et le centre relevé ajoute l'erreur du guidage (le téléphone guide l'opérateur
#       sur son propre GNSS) à celle de la mesure : aucune source consultée ne mesure cet écart cumulé (inférence de
#       l'acquéreur, non sourcée).

