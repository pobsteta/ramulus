murgas_2018:
  mesure: "RMSE de l'erreur horizontale : 8,45 m sous couvert (45 placettes), 6,61 m à découvert (5 placettes)"
  appareil: "récepteur GNSS de cartographie (« mapping-grade ») relevé en saison avec feuillage (2017) ; centres de placette vrais relevés par un récepteur topographique en saison sans feuillage (2018), forêt de Vígľaš, Slovaquie"
  citation: "« Root mean square error of horizontal accuracies was 8.45 m in the plots under forest canopy and 6.61 m under open sky conditions. »"
  precision_declaree_des_recepteurs_de_loisir_ou_cartographie: "« within 6-10 m » (p. 479, citée par les auteurs, non mesurée par eux)"

seuil_provisoire_30_m:
  valeur_proposee_par_adr_0004: 30
  unite: "mètres"
  statut: "valeur provisoire, non tranchée ; mesure : cette mission (sources publiées), puis un essai de Pascal sur le terrain (fiche 001)"
  rapports_calcules_par_l_acquereur:
    - "30 m / 8,45 m (RMSE Murgaš sous couvert) = 3,6"
    - "30 m / 13,38 m (CEP95 de la ligne All) = 2,2"
    - "30 m est inférieur au CEP95 de 41,99 m du Xcover 4 : plus de 5 % des fixes de ce modèle dépassent 41,99 m, donc au moins autant dépassent 30 m (conséquence logique du CEP95)."
    - "30 m est supérieur aux CEP95 de 9 des 10 téléphones testés (7,89 à 16,72 m)."
  lecture: "Un seuil de 30 m est un signal d'erreur grossière (ADR 0004). Il ne dit rien sur la qualité de l'ancrage d'un arbre : l'erreur typique d'un téléphone sous couvert (6 à 8 m) est bien en deçà ; le piquet et le numéro peint font l'identité (ADR 0004)."
  a_trancher:
    - id: G1
      question: "Garder 30 m comme valeur provisoire du seuil d'écart au point prévu ?"
      proposition_acquereur: "Oui, comme signal sans blocage, et le mesurer : relever 5 centres sur le même piquet à 5 passages différents (ou 2 appareils) pour obtenir l'erreur du téléphone de l'opérateur ; relire cet écart avant le gel de la mission 007."
    - id: G2
      question: "Corriger la citation de l'ADR 0003 de Surculus et celle de l'ADR 0004 de Ramulus (6,1 m, 13,4 m)"
      proposition_acquereur: "Ces chiffres viennent de la ligne « All » qui contient le récepteur de référence ; dire « 6,5 m pour les téléphones seuls, CEP95 13,4 à 13,6 m selon le groupe, jusqu'à 42 m pour un modèle ». L'ADR de Surculus n'est pas à Ramulus : le message passe par Pascal."

non_trouve:
  - "Effet du moyennage de la position sur l'erreur sous couvert, pour un téléphone (non testé par Purfürst ; une étude de récepteurs portatifs de loisir citée par une recherche, non lue, parle d'un gain entre 1 s et 5 min : non utilisée)."
  - "Écart cumulé entre le point prévu et le centre relevé quand le téléphone guide l'opérateur (E5)."
  - "Taux de couvert (en %) des 15 sites : le texte dit seulement qu'il varie."
